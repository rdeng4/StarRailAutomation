[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-rail-automation"
version = "0.1.0"
description = "Star Rail copilot desktop application"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[project.scripts]
star-rail-automation = "star_rail_automation.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
